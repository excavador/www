# Settings every site shares. Each mkdocs.yml uses INHERIT to pull this in, so
# a theme or extension change is one edit rather than three that drift.
theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle: {icon: material/brightness-auto, name: follow the system}
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: dark}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: light}

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.snippets

plugins:
  - search
  # Every page says when it was last touched. These sites describe a moving
  # target -- three repositories that release often -- and a doc page with no
  # date invites the reader to assume it is current. This session found a
  # README that had been wrong for ten releases because nothing dated it.
  - git-revision-date-localized:
      enable_creation_date: false
      fallback_to_build_date: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/excavador
